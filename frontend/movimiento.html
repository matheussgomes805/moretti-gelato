<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moretti Gelato Stock</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <button aria-label="abrir menu" aria-expanded="false" id="boton-menu">
          <span class="material-symbols-outlined"> menu </span>
        </button>

        <ul id="menu-navegacion">
          <li>
            <a href="index.html">
              <span class="material-symbols-outlined"> swap_horiz </span>
              Movimientos de stock</a
            >
          </li>

          <li>
            <a href="productos.html"
              ><span class="material-symbols-outlined"> inventory_2 </span>
              Listado de productos</a
            >
          </li>
        </ul>
      </nav>

      <h1>Moretti Gelato Stock</h1>
    </header>

    <main>
      <h2>Registrar movimiento</h2>

      <div>
        <div class="campo">
          <label for="tipo-movimiento">Tipo de movimiento</label>
          <select name="tipo-movimiento" id="tipo-movimiento">
            <option value="" selected disabled>
              Selecciona el tipo de movimiento
            </option>
            <option value="entrada">Entrada</option>
            <option value="salida">Salida</option>
          </select>
        </div>

        <div class="campo">
          <label for="producto">Producto</label>
          <select name="producto" id="producto">
            <option value="">x</option>
          </select>
        </div>

        <div class="campo">
          <label for="lote">Lote</label>
          <input type="text" name="lote" id="lote" />
        </div>

        <div class="campo">
          <label for="cantidad">Cantidad</label>
          <input type="number" name="cantidad" id="cantidad" />
        </div>

        <button>REGISTRAR MOVIMIENTO</button>
        <a href="index.html">CANCELAR</a>
      </div>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
