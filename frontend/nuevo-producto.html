<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moretti Gelato Stock</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="cabecera-superior">
        <button aria-label="abrir menu" aria-expanded="false" id="boton-menu">
          <span class="material-symbols-outlined"> menu </span>
        </button>
        <h1>Moretti Gelato Stock</h1>
      </div>

      <nav>
        <ul id="menu-navegacion">
          <li>
            <a href="index.html">
              <span class="material-symbols-outlined"> swap_horiz </span>
              Movimientos de stock</a
            >
          </li>

          <li>
            <a href="productos.html"
              ><span class="material-symbols-outlined"> inventory_2 </span>
              Listado de productos</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <div class="overlay"></div>

    <main>
      <h2>Nuevo producto</h2>

      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="nombre" />
      </div>

      <div class="campo">
        <label for="tipo-producto">Tipo de producto</label>
        <select name="tipo-producto" id="tipo-producto">
          <option value="" selected disabled>Selecciona una categoría</option>
          <option value="helado">Helado</option>
          <option value="sorbete">Sorbete</option>
          <option value="lacteo">Lácteo</option>
          <option value="ingrediente">Ingrediente</option>
          <option value="topping">Topping</option>
          <option value="envase">Envase</option>
          <option value="utensilio">Utensilio</option>
          <option value="consumible">Consumible</option>
          <option value="bebida">Bebida</option>
        </select>
      </div>

      <div class="campo">
        <label for="formato-producto">Formato/contenido</label>

        <input
          type="text"
          name="formato-producto"
          id="formato-producto"
          placeholder="Ej. 330"
        />

        <select name="unidad-medida" id="unidad-medida">
          <option value="ud">ud.</option>
          <option value="kg">kg</option>
          <option value="g">g</option>
          <option value="L">L</option>
          <option value="ml">ml</option>
          <option value="paquete">paquete</option>
        </select>
      </div>

      <button>GUARDAR</button>
      <a href="productos.html" class="boton">CANCELAR</a>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
