<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moretti Gelato Stock</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="cabecera-superior">
        <button aria-label="abrir menu" aria-expanded="false" id="boton-menu">
          <span class="material-symbols-outlined"> menu </span>
        </button>
        <a href="index.html" class="pantalla-principal">
          <h1>Moretti Gelato Stock</h1>
        </a>
      </div>

      <nav>
        <ul id="menu-navegacion">
          <li>
            <a href="index.html">
              <span class="material-symbols-outlined"> swap_horiz </span>
              Movimientos de stock</a
            >
          </li>

          <li>
            <a href="productos.html"
              ><span class="material-symbols-outlined"> inventory_2 </span>
              Listado de productos</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <div class="overlay"></div>

    <main>
      <h2>Nuevo producto</h2>

      <p class="nota-obligatorio">
        <span class="obligatorio">*</span> Campos obligatorios
      </p>

      <form action="#" class="formulario-producto">
        <div class="campo">
          <label for="nombre">Nombre <span class="obligatorio">*</span></label>
          <input type="text" name="nombre" id="nombre" required />
        </div>
        <div class="campo">
          <label for="tipo-producto"
            >Tipo de producto <span class="obligatorio">*</span></label
          >
          <div class="select-contenedor">
            <select name="tipo-producto" id="tipo-producto" required>
              <option value="" selected disabled>
                Selecciona una categoría
              </option>
              <option value="helado">Helado</option>
              <option value="sorbete">Sorbete</option>
              <option value="lacteo">Lácteo</option>
              <option value="ingrediente">Ingrediente</option>
              <option value="topping">Topping</option>
              <option value="utensilio">Utensilio</option>
              <option value="consumible">Consumible</option>
              <option value="bebida">Bebida</option>
            </select>
            <span class="material-symbols-outlined"> keyboard_arrow_down </span>
          </div>
        </div>

        <div class="campo">
          <label for="formato"
            >Formato <span class="obligatorio">*</span></label
          >

          <div class="select-contenedor">
            <select name="formato-producto" id="formato-producto" required>
              <option value="" selected disabled>
                Selecciona una categoria
              </option>
              <option value="caja">Caja</option>
              <option value="bolsa">Bolsa</option>
              <option value="botella">Botella</option>
              <option value="lata">Lata</option>
              <option value="envase">Envase</option>
              <option value="recipiente">Recipiente</option>
              <option value="paquete">Paquete</option>
            </select>

            <span class="material-symbols-outlined"> keyboard_arrow_down </span>
          </div>
        </div>

        <div class="campo">
          <label for="formato-producto"
            >Cantidad y unidad <span class="obligatorio">*</span></label
          >
          <div id="formato-contenido">
            <input
              type="text"
              name="formato-producto"
              id="formato-producto"
              placeholder="Ej. 12"
              required
            />
            <div class="select-contenedor">
              <select name="unidad-medida" id="unidad-medida" required>
                <option value="ud">ud.</option>
                <option value="kg">kg</option>
                <option value="g">g</option>
                <option value="L">l</option>
                <option value="ml">ml</option>
              </select>
              <span class="material-symbols-outlined">
                keyboard_arrow_down
              </span>
            </div>
          </div>
        </div>
      </form>

      <button type="submit" class="guardar-nuevo-producto">GUARDAR</button>
      <a href="productos.html" class="boton-cancelar">CANCELAR</a>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
